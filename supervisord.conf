[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
minfds=1024
minprocs=200
user=root

[program:vncserver]
command=/start-vnc.sh
autostart=true
autorestart=true
startsecs=10
startretries=10
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/var/log/vncserver_stdout.log
stderr_logfile=/var/log/vncserver_stderr.log
killasgroup=true
priority=1

[program:git-sync]
command=/usr/local/bin/git-sync watch 60
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=10
stopsignal=TERM
stdout_logfile=/var/log/gitsync_stdout.log
stderr_logfile=/var/log/gitsync_stderr.log
killasgroup=true
priority=2