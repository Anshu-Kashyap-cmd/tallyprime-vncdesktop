version: '3.8'

services:
  tally-vnc:
    build: .
    container_name: tallyprime-vnc-desktop
    hostname: tally-vnc
    ports:
      - "5901:5901"
      - "5902:5902"
    volumes:
      - tally-data:/root
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DISPLAY=:1
      - VNC_PASSWORD=vncpass
      - AI_LOG_FILE=/root/ailog.md
      - GIT_REMOTE=origin
      - GIT_BRANCH=main
      - GIT_REPO_URL=${GIT_REPO_URL:-}
    privileged: true
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
    entrypoint: /bin/bash
    command:
      - -lc
      - |
        set -e

        echo "=== Tally Prime VNC Desktop Starting ==="

        # Configure git remote if provided
        if [ -n "$GIT_REPO_URL" ]; then
          echo "Configuring git remote..."
          git remote add origin "$GIT_REPO_URL" 2>/dev/null || true
          git fetch origin 2>/dev/null || true
          git checkout -B main origin/main 2>/dev/null || git checkout -b main
        fi

        # Start VNC server in background
        echo "Starting VNC server..."
        /start-vnc.sh &
        VNC_PID=$!

        sleep 5

        # Start websockify for web-based VNC access (fixes 502 errors)
        echo "Starting websockify for web access..."
        /usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:5902 127.0.0.1:5901 &
        SOCK_PID=$!

        sleep 2

        # Start git-sync in background
        echo "Starting git-sync..."
        /usr/local/bin/git-sync watch 60 &
        GIT_PID=$!

        echo ""
        echo "=========================================="
        echo "  Tally Prime DevContainer is READY!"
        echo "=========================================="
        echo "  VNC Connect: localhost:5901"
        echo "  Password: vncpass"
        echo "  Web VNC: http://localhost:5902/vnc.html"
        echo "  Tally: wine /opt/TallyPrime/Tally.exe"
        echo "  Python: /opt/venv/bin/python"
        echo "=========================================="
        echo ""

        # Monitor loop - restart services if they crash
        while true; do
          if ! kill -0 $VNC_PID 2>/dev/null; then
            echo "[$(date)] VNC crashed, restarting..."
            /start-vnc.sh &
            VNC_PID=$!
          fi
          if ! kill -0 $SOCK_PID 2>/dev/null; then
            echo "[$(date)] websockify crashed, restarting..."
            /usr/bin/websockify --web=/usr/share/novnc 0.0.0.0:5902 127.0.0.1:5901 &
            SOCK_PID=$!
          fi
          sleep 10
        done

volumes:
  tally-data: